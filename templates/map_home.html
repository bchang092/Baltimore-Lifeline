  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

  <style>
    :root{
      --header-h: 68px;
      --bg: #0f172a; --bg-2: #0b1220; --panel: #111827; --text: #e5e7eb;
      --muted: #9ca3af; --border: rgba(255,255,255,0.08); --shadow: rgba(0,0,0,0.35);
      --accent: #38bdf8; --accent-2: #10b981; --warning: #f59e0b; --danger: #ef4444;
    }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100%;
      background: linear-gradient(180deg, var(--bg), var(--bg-2) 60%, #070b14);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #map { height: calc(100vh - var(--header-h)); width: 100%; }

    /* Toolbar with collapsible filters */
    .map-toolbar {
      position: absolute; z-index: 1000; top: calc(var(--header-h) + 20px); left: 124px;
      background: rgba(17, 24, 39, 0.94); backdrop-filter: saturate(140%) blur(4px);
      padding: 8px 10px 10px; border-radius: 12px; box-shadow: 0 8px 24px var(--shadow);
      border: 1px solid var(--border); max-width: min(calc(100vw - 144px), 820px); color: var(--text);
    }
    .map-nav-float {
      position: absolute;
      z-index: 1001;
      top: calc(var(--header-h) + 10px);
      left: 10px;
    }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .filter-toggle {
      background: rgba(15,23,42,0.96);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 700;
    }
    .filter-hide {
      background: rgba(15,23,42,0.96);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filters-panel {
      margin-top: 8px;
      display: none;
    }
    .filters-panel.open {
      display: block;
    }
    .toolbar-row input, .toolbar-row button {
      font-size: 14px; padding: 8px 10px; margin-right: 6px; margin-top: 6px;
      border-radius: 10px; border: 1px solid var(--border);
      background: #0e1524; color: var(--text); outline: none;
    }
    .map-toolbar input::placeholder { color: #94a3b8; }
    .toolbar-row button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #081018; font-weight: 700; border: 0; cursor: pointer;
      box-shadow: 0 6px 16px rgba(56,189,248,0.25), 0 4px 10px rgba(16,185,129,0.20);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(22,31,49,0.9), rgba(12,18,31,0.86));
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .back-btn svg {
      width: 16px;
      height: 16px;
    }
    .legend { margin-top: 6px; font-size: 12px; line-height: 1.4; color: #cbd5e1; }
    .legend-item { display: inline-flex; align-items: center; margin-right: 12px; margin-top: 6px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.2) inset; }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .filter-section {
      margin-top: 10px;
    }
    .filter-section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #cbd5e1;
      margin: 0 0 6px;
    }
    .filter-pill {
      cursor: pointer;
      opacity: 0.85;
      background: rgba(15,23,42,0.9);
    }
    .filter-pill.active {
      opacity: 1;
      background: rgba(56,189,248,0.14);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56,189,248,0.6) inset;
    }

    .leaflet-control-zoom a {
      background: #0e1524; color: var(--text); border: 1px solid var(--border);
      box-shadow: 0 4px 12px var(--shadow);
    }
    .leaflet-control-zoom a:hover { background: #121a2d; }
    .leaflet-control-attribution {
      background: rgba(17,24,39,0.9); color: #cbd5e1; border: 1px solid var(--border);
      backdrop-filter: blur(4px);
    }
    .leaflet-container a { color: var(--accent); }

    .sidebar {
      position: absolute; z-index: 1100; top: var(--header-h); right: 0; height: calc(100% - var(--header-h)); width: min(660px, 55vw);
      background: linear-gradient(180deg, #0b1220, #0e1526); color: var(--text);
      box-shadow: -12px 0 28px rgba(0,0,0,0.45); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform .28s ease; display: flex; flex-direction: column;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
    .sidebar-title { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: .2px; }
    .sidebar-close { background: #0e1524; color: #cbd5e1; border: 1px solid var(--border);
      border-radius: 10px; padding: 6px 10px; cursor: pointer; }
    .sidebar-body { padding: 14px 16px 18px; overflow-y: auto; }

    .sidebar a {
      color: #7dd3fc;
    }
    .sidebar a:hover {
      color: #bae6fd;
    }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 12px;
      background: rgba(148,163,184,0.12); border: 1px solid var(--border); color: #cbd5e1; margin: 0 8px 10px 0; }
    .field { margin: 10px 0; color: #cbd5e1; }
    .label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
    .link-btn { display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #081018; font-weight: 800; text-decoration: none; border-radius: 12px; padding: 10px 14px; margin-top: 8px;
      box-shadow: 0 6px 16px rgba(56,189,248,0.25), 0 4px 10px rgba(16,185,129,0.20); }

    @media (max-width: 640px) {
      .map-toolbar {
        left: 12px;
        top: calc(var(--header-h) + 12px);
        max-width: calc(100vw - 20px);
      }
      .map-toolbar input {
        width: calc(100% - 96px);
        box-sizing: border-box;
      }
      .sidebar {
        top: auto;
        bottom: 0;
        width: 100%;
        height: min(88vh, 620px);
        max-height: calc(100vh - var(--header-h));
        border-left: 0;
        border-top: 1px solid var(--border);
        border-radius: 18px 18px 0 0;
        transform: translateY(100%);
        box-shadow: 0 -12px 30px rgba(0,0,0,0.45);
      }
      .sidebar.open { transform: translateY(0); }
      .sidebar-header { padding: 18px 20px 14px; }
      .sidebar-header::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 4px; border-radius: 999px; background: rgba(148,163,184,0.45); transform: translateX(-50%); }
      .sidebar-body { padding: 16px 20px 24px; }
      .link-btn { min-height: 48px; width: 100%; justify-content: center; }
    }
    .sidebar{width:min(660px,55vw);background:#0c1a25;border-left-color:rgba(53,214,192,.22);box-shadow:-40px 0 90px rgba(0,0,0,.55);transition:transform 260ms cubic-bezier(.2,.8,.2,1)}.sidebar-header{padding:34px 44px 24px;background:#0c1a25;border-bottom-color:rgba(125,211,252,.10)}.sidebar-title{font:500 32px/1.06 "Space Grotesk",sans-serif;letter-spacing:-.03em}.sidebar-close{height:38px;padding:9px 17px;border-radius:999px;flex:0 0 auto}.sidebar-body{padding:30px 44px 26px}.sidebar .field:first-child{padding-bottom:22px;border-bottom:1px solid rgba(125,211,252,.10)}.sidebar .field{font-size:14.5px;line-height:1.6}.sidebar .label{color:#5d7889;font:500 10px "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase}.sidebar .link-btn{margin-top:auto;min-height:48px;border-radius:10px}.sidebar a{color:#e8f1f5}@media(max-width:860px){.sidebar{width:100%;max-height:88vh}.sidebar-header{padding:28px 24px 18px}.sidebar-body{padding:24px}.sidebar .link-btn{width:100%;justify-content:center}}
  </style>
</head>

  <div class="map-toolbar" role="region" aria-label="Map search and filters">
    <div class="toolbar-row">
      <input id="searchInput" type="text" placeholder="Search address or name of service" aria-label="Search" />
      <button id="resetBtn" type="button">Reset</button>
      <button id="filterToggle" class="filter-toggle" type="button" aria-label="Toggle filters">Filters</button>
      <button id="filterHide" class="filter-hide" type="button" aria-label="Hide filters">Hide</button>
    </div>
    <div id="filtersPanel" class="filters-panel">
      <div class="filter-section">
        <div class="filter-section-label">Type of Help</div>
        <div id="categoryTags" class="tag-container" aria-label="Filter by category"></div>
      </div>
      <div class="filter-section">
        <div class="filter-section-label">Reliability</div>
        <div id="reliabilityTags" class="tag-container" aria-label="Filter by reliability"></div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- Map -->
  <div id="map" role="application" aria-label="Resource map"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-header">
      <h3 class="sidebar-title" id="sidebar-title">Details</h3>
      <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close details">Close</button>
    </div>
    <div class="sidebar-body" id="sidebar-body"></div>
  </aside>

  <!-- Embed backend data -->
  {{ resources|json_script:"resources-data" }}
  {{ consolidated_categories|json_script:"consolidated-categories-data" }}

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    const resources = JSON.parse(document.getElementById("resources-data").textContent);
    const consolidatedCategories = JSON.parse(
      document.getElementById("consolidated-categories-data").textContent
    );

    const map = L.map("map", { zoomControl: false });
    L.control.zoom({ position: "bottomleft" }).addTo(map);
    window.addEventListener('resize', () => map.invalidateSize({ pan: false }), { passive: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);

    const CATEGORY_COLORS = {
      "Food & Essential Needs": "#ef4444",
      "Housing & Shelter": "#2563eb",
      "Physical & General Health Care": "#14b8a6",
      "Behavioral Health, Substance Use, & Crisis": "#8b5cf6",
      "Financial & Access Support": "#f59e0b",
      "Employment, Training, & Education": "#ec4899",
      "Youth, Family, & General Support Services": "#22c55e",
      "Safety & Anti-Violence": "#f97316",
      "Veteran Services": "#84cc16",
      "Other / Uncategorized": "#64748b",
    };
    const categoryColorMap = new Map(Object.entries(CATEGORY_COLORS));
    const RELIABILITY_OPTIONS = [
      { key: "highly-reliable", label: "Highly Reliable", color: "#22c55e" },
      { key: "reliable", label: "Reliable", color: "#65a30d" },
      { key: "thin-reviews", label: "Thin Reviews", color: "#0891b2" },
      { key: "mixed-reviews", label: "Mixed Reviews", color: "#f59e0b" },
      { key: "low-reliability", label: "Low Reliability", color: "#ef4444" },
      { key: "not-confirmed", label: "Not yet confirmed", color: "#9ca3af" },
    ];

    function hashColor(text) {
      const s = (text || "").toString();
      let hash = 0;
      for (let i = 0; i < s.length; i += 1) {
        hash = ((hash << 5) - hash) + s.charCodeAt(i);
        hash |= 0;
      }
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue} 72% 52%)`;
    }

    function colorForCategory(cat) {
      if (!cat) return "#6c757d";
      if (!categoryColorMap.has(cat)) {
        categoryColorMap.set(cat, hashColor(cat));
      }
      return categoryColorMap.get(cat);
    }

    function getReliabilityMeta(resource) {
      const rawRel = (resource.avg_reliability_ratings || resource.reliability || "").toString().trim().toLowerCase();
      const rating = parseFloat(rawRel);
      const hasNumericRating = !isNaN(rating);

      if (hasNumericRating && rating >= 8) {
        return RELIABILITY_OPTIONS[0];
      }
      if (hasNumericRating && rating >= 7) {
        return RELIABILITY_OPTIONS[1];
      }
      if (hasNumericRating && rating >= 6) {
        return RELIABILITY_OPTIONS[2];
      }
      if (hasNumericRating && rating >= 4) {
        return RELIABILITY_OPTIONS[3];
      }
      if (hasNumericRating && rating >= 1) {
        return RELIABILITY_OPTIONS[4];
      }
      return RELIABILITY_OPTIONS[5];
    }

    // ----- Category tag filtering -----
    const activeCategories = new Set(); // empty => All
    const activeReliability = new Set(); // empty => All

    function renderCategoryTags() {
      const categories = (consolidatedCategories && consolidatedCategories.length
        ? consolidatedCategories.slice()
        : Array.from(new Set(resources.map(r => r.category).filter(Boolean)))
      ).filter(Boolean).sort();
      const container = document.getElementById("categoryTags");
      container.innerHTML = "";
      const heading = document.createElement("div"); heading.className = "rail__grouphd";
      heading.innerHTML = `<span class="rail__label">Type of Help</span><button class="rail__all" type="button" data-category="__ALL__" data-group="category">${activeCategories.size} of ${categories.length}</button>`;
      container.appendChild(heading);

      // Category pills
      categories.forEach(c => {
        const btn = document.createElement("button");
        btn.type = "button";
        const count = resources.filter(r => r.category === c).length;
        btn.innerHTML = `<span class="opt__box" aria-hidden="true"><svg viewBox="0 0 10 8"><path d="M1 4.2 3.6 6.8 9 1.4"/></svg></span><span class="opt__name">${c}</span><span class="opt__dot" style="background:${colorForCategory(c)}"></span><span class="opt__count">${count}</span>`;
        btn.className = "filter-pill opt";
        btn.setAttribute("role", "checkbox"); btn.setAttribute("aria-checked", "false");
        btn.dataset.category = c;
        btn.dataset.group = "category";
        container.appendChild(btn);
      });

      // Click handler (event delegation)
      container.addEventListener("click", (e) => {
        const pill = e.target.closest(".filter-pill, .rail__all");
        if (!pill) return;
        const cat = pill.dataset.category;
        toggleCategory(cat);
      });
    }

    function renderReliabilityTags() {
      const container = document.getElementById("reliabilityTags");
      container.innerHTML = "";
      const heading = document.createElement("div"); heading.className = "rail__grouphd";
      heading.innerHTML = `<span class="rail__label">Reliability</span><button class="rail__all" type="button" data-reliability="__ALL__" data-group="reliability">${activeReliability.size} of ${RELIABILITY_OPTIONS.length}</button>`;
      container.appendChild(heading);

      RELIABILITY_OPTIONS.forEach(option => {
        const btn = document.createElement("button");
        btn.type = "button";
        const count = resources.filter(r => getReliabilityMeta(r).key === option.key).length;
        btn.innerHTML = `<span class="opt__box" aria-hidden="true"><svg viewBox="0 0 10 8"><path d="M1 4.2 3.6 6.8 9 1.4"/></svg></span><span class="opt__name">${option.label}</span><span class="opt__count">${count}</span>`;
        btn.className = "filter-pill opt opt--reliability";
        btn.setAttribute("role", "checkbox"); btn.setAttribute("aria-checked", "false");
        btn.dataset.reliability = option.key;
        btn.dataset.group = "reliability";
        container.appendChild(btn);
      });

      container.addEventListener("click", (e) => {
        const pillEl = e.target.closest(".filter-pill, .rail__all");
        if (!pillEl) return;
        const key = pillEl.dataset.reliability;
        toggleReliability(key);
      });
    }

    function updateFilterGroupState(group, activeSet) {
      const allPill = document.querySelector(`.rail__all[data-group="${group}"]`);
      const usingAll = activeSet.size === 0;

      if (allPill) {
        allPill.textContent = `${activeSet.size} of ${document.querySelectorAll(`.filter-pill[data-group="${group}"]`).length}`;
      }

      document.querySelectorAll(`.filter-pill[data-group="${group}"]`).forEach(p => {
        const key = p.dataset[group];
        p.classList.toggle("active", activeSet.has(key));
        p.setAttribute("aria-checked", String(activeSet.has(key)));
      });
    }

    function updatePillStates() {
      updateFilterGroupState("category", activeCategories);
      updateFilterGroupState("reliability", activeReliability);
    }

    function toggleCategory(cat) {
      if (cat === "__ALL__") {
        activeCategories.clear();
      } else {
        if (activeCategories.has(cat)) {
          activeCategories.delete(cat);
        } else {
          activeCategories.add(cat);
        }
      }
      updatePillStates();
      applyFilters();
    }

    function toggleReliability(key) {
      if (key === "__ALL__") {
        activeReliability.clear();
      } else {
        if (activeReliability.has(key)) {
          activeReliability.delete(key);
        } else {
          activeReliability.add(key);
        }
      }
      updatePillStates();
      applyFilters();
    }

    renderCategoryTags();
    renderReliabilityTags();

    function updateLegend(data) {
      const legend = document.getElementById("legend");
      const categories = Array.from(new Set(data.map(r => r.category).filter(Boolean))).sort();
      if (!categories.length) {
        legend.innerHTML = "";
        return;
      }
      legend.innerHTML = categories.map(c => (
        `<span class="legend-item">
           <span class="legend-swatch" style="background:${colorForCategory(c)}"></span>${c}
         </span>`
      )).join("");
    }

    // ----- Sidebar -----
    const sidebarEl = document.getElementById('sidebar');
    const sidebarTitleEl = document.getElementById('sidebar-title');
    const sidebarBodyEl = document.getElementById('sidebar-body');
    const sidebarCloseBtn = document.getElementById('sidebar-close');

    function pill(text, bg) {
      return `<span class="pill" style="border-color:${bg}; box-shadow:0 0 0 1px ${bg} inset;">${text}</span>`;
    }

    function openSidebar(r) {
      const dest = r.address ? encodeURIComponent(r.address) : `${r.lat},${r.lng}`;
      const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${dest}`;

      const reliabilityMeta = getReliabilityMeta(r);
      const filled = /highly reliable/i.test(reliabilityMeta.label) ? 5 : /reliable/i.test(reliabilityMeta.label) ? 4 : /mixed|moderate/i.test(reliabilityMeta.label) ? 3 : /thin/i.test(reliabilityMeta.label) ? 2 : /low/i.test(reliabilityMeta.label) ? 1 : 0;
      const meter = Array.from({length: 5}, (_, i) => `<i class="${i < filled ? 'on' : ''}"></i>`).join('');
      const phoneHtml = r.phone_number
        ? `<div class="sheet-field"><span class="label">Phone</span><a href="tel:${r.phone_number}">${r.phone_number}</a></div>`
        : "";
      const hoursHtml = r.days
        ? `<div class="sheet-field"><span class="label">Hours / Availability</span><div>${r.days}</div></div>`
        : "";

      sidebarTitleEl.textContent = r.name || "Unnamed resource";
      sidebarBodyEl.innerHTML = `
        <div class="sheet-eyebrow">${r.category || 'Uncategorized'}</div>
        ${r.address ? `<div class="sheet-address"><span class="label">Address</span><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}" target="_blank" rel="noopener noreferrer">${r.address}</a></div>` : ""}
        <div class="sheet-pair">${phoneHtml}${hoursHtml}</div>
        <div class="sheet-reliability"><span class="label">Reliability</span><div class="meter-row" style="--tier:${reliabilityMeta.color}"><div class="reliability-meter">${meter}</div><span>${reliabilityMeta.label}</span></div></div>
        ${r.condensed_reliability_description ? `<div class="sheet-notes"><span class="label">Reliability Notes</span><p>${r.condensed_reliability_description}</p></div>` : ""}
        <div class="sheet-footer"><a class="link-btn" href="${gmaps}" target="_blank" rel="noopener noreferrer">Open in Google Maps</a>${r.link ? `<a class="site-btn" href="${r.link}" target="_blank" rel="noopener noreferrer">Visit site</a>` : ""}</div>
      `;

      sidebarEl.classList.add('open');
      sidebarEl.setAttribute('aria-hidden', 'false');
    }

    function closeSidebar() {
      sidebarEl.classList.remove('open');
      sidebarEl.setAttribute('aria-hidden', 'true');
    }

    sidebarCloseBtn.addEventListener('click', closeSidebar);
    map.on('click', closeSidebar);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

    // ----- Markers + filters -----
    function addMarkers(data) {
      markerLayer.clearLayers();
      const bounds = [];

      data.forEach(r => {
        if (typeof r.lat !== "number" || typeof r.lng !== "number") return;

        const color = colorForCategory(r.category);
        const icon = L.divIcon({
          className: "custom-pin",
          html: `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36" aria-hidden="true" focusable="false">
              <path d="M12 0C5.4 0 0 5.4 0 12c0 7.5 12 24 12 24s12-16.5 12-24c0-6.6-5.4-12-12-12z"
                    fill="${color}" stroke="white" stroke-width="2"/>
            </svg>`,
          iconSize: [24, 36],
          iconAnchor: [12, 36],
        });

        const marker = L.marker([r.lat, r.lng], { icon });
        marker.on('click', () => openSidebar(r));
        marker.addTo(markerLayer);
        bounds.push([r.lat, r.lng]);
      });

      updateLegend(data);

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [30, 30] });
      } else {
        map.setView([39.2904, -76.6122], 11);
      }
    }

    const searchInput = document.getElementById("searchInput");
    const resetBtn = document.getElementById("resetBtn");

    function applyFilters() {
      const q = (searchInput.value || "").toLowerCase().trim();
      const useAllCats = activeCategories.size === 0;
      const useAllReliability = activeReliability.size === 0;

      const filtered = resources.filter(r => {
        const inCat = useAllCats || activeCategories.has(r.category);
        const reliabilityMeta = getReliabilityMeta(r);
        const inReliability = useAllReliability || activeReliability.has(reliabilityMeta.key);
        const text = `${r.name || ""} ${r.address || ""}`.toLowerCase();
        const matches = !q || text.includes(q);
        return inCat && inReliability && matches;
      });

      closeSidebar();
      addMarkers(filtered);
    }

    searchInput.addEventListener("input", applyFilters);
    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      activeCategories.clear();
      activeReliability.clear();
      updatePillStates();
      closeSidebar();
      addMarkers(resources);
    });

    // ----- Filters toggle -----
    const filterToggle = document.getElementById("filterToggle");
    const filterHide = document.getElementById("filterHide");
    const filtersPanel = document.getElementById("filtersPanel");

    function openFilters() {
      filtersPanel.classList.add("open");
    }
    function closeFilters() {
      filtersPanel.classList.remove("open");
    }

    // The floating toolbar below owns filter-panel open/close state.

    // Initial state: all categories, all markers visible
    updatePillStates();
    addMarkers(resources);
  </script>
  <style>
    /* Map controls are positioned within the post-header map area. */
    .map-toolbar { z-index:600; width:clamp(320px,36vw,540px); max-width:calc(100vw - 48px); }
    .toolbar-row { display:grid!important; grid-template-columns:minmax(0,1fr) auto auto auto; width:100%; }
    .toolbar-row input { width:100%; min-width:0; text-overflow:ellipsis; }
    .toolbar-row #resetBtn,.toolbar-row #filterToggle,.toolbar-row #filterHide { display:flex!important; flex:0 0 auto!important; align-items:center; justify-content:center; white-space:nowrap; }
    .rail__safety { z-index:500; }
    .filter-sheet-head,.filter-scrim { display:none; }
    @media(max-width:1100px){ .toolbar-row{grid-template-columns:minmax(0,1fr) auto auto}.toolbar-row #filterHide{display:none!important} }
    @media(max-width:860px){ .map-toolbar{left:12px;right:12px;top:calc(var(--header-h) + 12px);width:auto;max-width:none}.toolbar-row{grid-template-columns:minmax(0,1fr) auto;height:48px}.toolbar-row #resetBtn{display:none!important} }
    @media(max-width:640px){
      body.filter-sheet-open{overflow:hidden}.filters-panel.open{position:fixed!important;z-index:1100;top:auto;bottom:0;left:0;right:0;width:auto;max-height:78vh;margin:0;border:1px solid rgba(125,211,252,.16);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -18px 44px rgba(0,0,0,.5);overflow:auto;transform:translateY(0);transition:transform 240ms cubic-bezier(.2,.8,.2,1)}.filter-scrim.open{display:block;position:fixed;inset:0;z-index:1090;background:rgba(4,10,15,.55)}.filter-sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px 12px;background:#0c1a25;border-bottom:1px solid rgba(125,211,252,.10)}.filter-sheet-head::before{content:"";position:absolute;top:10px;left:calc(50% - 18px);width:36px;height:4px;border-radius:999px;background:rgba(125,211,252,.25)}.filter-sheet-title{margin-top:12px;color:#9db6c4;font:500 9.5px "IBM Plex Mono",monospace;letter-spacing:.14em}.filter-sheet-clear{margin-top:12px;border:0;background:none;color:#35d6c0;font:500 10px "IBM Plex Mono",monospace;letter-spacing:.12em;cursor:pointer}.tag-container{grid-template-columns:1fr!important;max-height:none}.opt,.filter-pill,.pill{min-height:44px}.filter-results{position:sticky;bottom:0;margin:0;padding:12px 18px;background:#0c1a25;border-top:1px solid rgba(125,211,252,.10)}.filter-results button{width:100%;height:48px;border:0;border-radius:10px;background:linear-gradient(90deg,#35d6c0,#86efac);color:#06131a;font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer}.rail__safety{display:none} }
  </style>
  <style>
    /* Keep filters usable on small screens: Hide clears the map view after filtering. */
    .rail__grouphd,#reliabilityTags .rail__grouphd{display:flex!important;align-items:baseline;justify-content:space-between;width:100%;min-width:0;box-sizing:border-box;padding:18px 20px 14px!important;border-bottom:1px solid rgba(125,211,252,.10)!important}
    .rail__grouphd .rail__label{min-width:0}.rail__grouphd .rail__all{flex:0 0 auto;margin-left:16px;white-space:nowrap}
    #reliabilityTags{padding:8px!important;gap:2px!important}
    @media(max-width:1100px){ .toolbar-row #filterHide{display:flex!important} }
    @media(max-width:860px){
      .toolbar-row{grid-template-columns:minmax(0,1fr) auto auto}.toolbar-row #filterHide{display:flex!important}.toolbar-row #resetBtn{display:none!important}
      .filters-panel.open{position:absolute!important;top:56px;bottom:auto;left:0;right:0;width:auto;max-height:calc(100vh - var(--header-h) - 88px);border-radius:10px;overflow-y:auto;transform:none;box-shadow:0 18px 44px rgba(0,0,0,.45)}
      .filter-scrim{display:none!important}.filter-sheet-head{display:none!important}body.filter-sheet-open{overflow:auto}
    }
    @media(max-width:640px){
      .filters-panel.open{position:absolute!important;top:56px;bottom:auto;left:0;right:0;width:auto;max-height:calc(100vh - var(--header-h) - 88px);border-radius:10px;overflow-y:auto;transform:none;box-shadow:0 18px 44px rgba(0,0,0,.45)}
      .filter-scrim{display:none!important}.filter-sheet-head{display:none!important}body.filter-sheet-open{overflow:auto}
    }
  </style>
</body>
<script>
  (function () {
    const bar=document.querySelector('.map-toolbar'), panel=document.getElementById('filtersPanel'), toggle=document.getElementById('filterToggle'), hide=document.getElementById('filterHide'), reset=document.getElementById('resetBtn'), safety=document.querySelector('.rail__safety'), search=document.getElementById('searchInput');
    if (!bar || !panel || !toggle) return;
    const sheetHead=document.createElement('div');sheetHead.className='filter-sheet-head';sheetHead.innerHTML='<span class="filter-sheet-title">TYPE OF HELP</span><button class="filter-sheet-clear" type="button">CLEAR · RESET</button>';panel.prepend(sheetHead);
    const scrim=document.createElement('div');scrim.className='filter-scrim';document.body.append(scrim);
    function refreshToolbar(){const selected=panel.querySelectorAll('.filter-pill.active').length;toggle.innerHTML=`Filters <span class="caret">⌄</span>${selected?`<span class="fb__badge">${selected}</span>`:''}`;reset.classList.toggle('active',selected>0||search.value.length>0)}
    panel.classList.add('open');
    refreshToolbar();
    function close(){panel.classList.remove('open');toggle.classList.remove('open');toggle.setAttribute('aria-expanded','false');scrim.classList.remove('open');document.body.classList.remove('filter-sheet-open')}
    function open(){panel.classList.add('open');panel.scrollTop=0;toggle.classList.add('open');toggle.setAttribute('aria-expanded','true');if(innerWidth<=640){scrim.classList.add('open');document.body.classList.add('filter-sheet-open')}refreshToolbar()}
    toggle.addEventListener('click',event=>{event.stopImmediatePropagation();if(bar.classList.contains('is-hidden')){bar.classList.remove('is-hidden');localStorage.setItem('mapFiltersHidden','0');return}panel.classList.contains('open')?close():open()});
    hide.addEventListener('click',()=>{bar.classList.add('is-hidden');close()});
    sheetHead.querySelector('button').addEventListener('click',()=>reset.click()); scrim.addEventListener('click',close);
    document.addEventListener('click',event=>{if(!bar.contains(event.target))close()});document.addEventListener('keydown',event=>{if(event.key==='Escape')close()});
    document.getElementById('map').addEventListener('click',close);panel.addEventListener('click',()=>setTimeout(refreshToolbar,0));reset.addEventListener('click',()=>setTimeout(refreshToolbar,0));search.addEventListener('input',refreshToolbar);addEventListener('resize',()=>{search.placeholder=innerWidth>1200?'Search address or name':'Search';panel.scrollTop=0;if(innerWidth>640){panel.classList.add('open');toggle.classList.add('open');toggle.setAttribute('aria-expanded','true');scrim.classList.remove('open');document.body.classList.remove('filter-sheet-open')}});search.placeholder=innerWidth>1200?'Search address or name':'Search';
    if(safety)safety.addEventListener('click',event=>{if(event.offsetX>safety.clientWidth-32)safety.style.display='none'});
  })();
</script>
</html>
