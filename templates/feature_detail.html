<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Baltimore Lifeline - {{ feature.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(17,24,39,0.9);
      --panel-soft: rgba(255,255,255,0.035);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #10b981;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(circle at top left, rgba(56,189,248,0.12), transparent 28%),
        linear-gradient(180deg, var(--bg), #111827 60%, #0b1220);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 24px 96px;
    }
    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 42px;
    }
    .ghost-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    .ghost-link:hover { text-decoration: underline; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.8fr);
      gap: 26px;
      align-items: stretch;
    }
    .hero-copy,
    .hero-side,
    .section {
      background: var(--panel-soft);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 26px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.2);
    }
    .hero-copy {
      padding: 34px 32px 36px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      margin-bottom: 14px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(56,189,248,0.12);
      border: 1px solid rgba(56,189,248,0.24);
      color: #bae6fd;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.08;
    }
    .hero-copy p {
      margin: 0;
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.78;
      max-width: 58ch;
    }
    .hero-side {
      padding: 28px 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
        var(--panel);
    }
    .hero-side h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: #f8fafc;
    }
    .hero-side p {
      margin: 0;
      color: #aeb5c1;
      font-size: 0.98rem;
      line-height: 1.72;
    }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, 0.85fr);
      gap: 26px;
      margin-top: 30px;
    }
    .section {
      padding: 30px 28px 32px;
    }
    .section h2 {
      margin: 0 0 18px;
      font-size: 1.35rem;
    }
    .points {
      display: grid;
      gap: 16px;
    }
    .point {
      padding: 18px 18px 16px;
      border-radius: 18px;
      background: rgba(15,23,42,0.55);
      border: 1px solid rgba(56,189,248,0.14);
    }
    .point strong {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      margin-bottom: 12px;
      background: rgba(56,189,248,0.14);
      color: var(--accent);
    }
    .point p,
    .section p {
      margin: 0;
      color: #b9c2cf;
      line-height: 1.72;
    }
    .cta-row {
      margin-top: 28px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .cta-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
    }
    .cta-link.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #081018;
    }
    .cta-link.secondary {
      border: 1px solid rgba(255,255,255,0.12);
      color: #dbeafe;
      background: rgba(255,255,255,0.03);
    }
    @media (max-width: 820px) {
      .hero,
      .content-grid {
        grid-template-columns: 1fr;
      }
      .container {
        padding: 20px 18px 72px;
      }
      .hero-copy,
      .hero-side,
      .section {
        border-radius: 22px;
      }
      .hero-copy,
      .section {
        padding: 24px 20px 26px;
      }
      .hero-side {
        padding: 22px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a class="ghost-link" href="{% url 'homepage' %}">Home</a>
    </div>

    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">{{ feature.eyebrow }}</div>
        <h1>{{ feature.title }}</h1>
        <p>{{ feature.intro }}</p>
      </div>
      <aside class="hero-side">
        <h2>Summary</h2>
        <p>{{ feature.summary }}</p>
      </aside>
    </section>

    <section class="content-grid">
      <div class="section">
        <h2>How this shows up in the project</h2>
        <div class="points">
          {% for item in feature.highlights %}
            <div class="point">
              <strong>{{ forloop.counter }}</strong>
              <p>{{ item }}</p>
            </div>
          {% endfor %}
        </div>
      </div>

      <div class="section">
        <h2>{{ feature.commitment_title }}</h2>
        <p>{{ feature.commitment_body }}</p>
      </div>
    </section>
  </div>
</body>
</html>
